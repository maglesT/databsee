# Demo company (DEMO-ONLY, docs/demo-company.md): rehearsal of the go-live on the owner's server, test address only.
# Removed completely after the rehearsal (owner's go-live plan, Phase 1); nothing of it goes into the real install.
customer: demo
version: 1.26.8 # (1.26.8: MMS send back to QC, CAPA link through sign-in; 1.26.7: EM alert does not hold Injectables QC approval; 1.26.6: QMS owns CAPA while linked; 1.26.5: LIMS test code fix for old requests, Liquids round 45; 1.26.4: LIMS units for osmolality and dissolved oxygen; 1.26.3: MMS sampling from LIMS and count after use, round 45 test codes, API reads LIMS results; 1.26.2: OEE API runs, Deviations reporter view, LIMS EM batch and time, Injectables EM from LIMS; 1.26.1: LIMS reads packing batches; 1.26.0: in-process lab tests from LIMS in every TrueBatch product, MMS linked fixes; 1.25.2: LIMS reported figure bare again; 1.25.1: LIMS reduced testing, viscosity units, all-edition batches, OOS rounding; Deviations OOS fix; QMS PQR refill and starting materials; 1.25.0: readers round 2, products read LIMS CoAs, results, OOS, stability, trends and instrument use; MMS receives API lots; 1.24.4: Oral Liquids shipper count published, holding tank room warning; 1.24.3: Oral Liquids master reviews show every change (round 38), make-up by kind; 1.24.2: optional minimum times are waits again (round 39); 1.24.1: master reviews show every change, stop checks on unset limits refused, LIMS review and CoA fixes; 1.24.0: fix rounds of all TrueBatch products, LIMS step 8; 1.23.0: Medhanta LIMS steps 6 and 7, stability, micro, EM and water) (1.22.4: TrueBatch API fix round 2, QA hold release, formula lines by kind, packing units; 1.22.3: TrueBatch Capsules, QA releases a QA hold on the step screen; 1.22.2: Injectables ports of Tablets rounds 29, 31, 32; 1.22.1: TrueBatch Capsules Packing, packing material unit kept on its steps; 1.22.0: Medhanta LIMS step 5, instrument data capture) (1.21.2: TrueBatch API fix round, intermediate molecular weight on the stage screen, QMS "none" product, Tablets round 31; 1.21.1: TrueBatch Capsules fix round, soft gel machines, good output in batch_fact_v1, Tablets rounds 29 and 31; 1.21.0: Medhanta LIMS step 4, OOS and OOT, lab inventory, instruments) platform release (1.20.0: Logbook, MMS, Deviations and OEE read TrueBatch Capsules, Oral Liquids and API; TrueBatch rounds 29-31; 1.19.1: Medhanta LIMS fix, specification limit with no unit; platform release (1.19.0: TrueBatch Liquids and Liquids Packing on the platform; 1.18.0: Medhanta LIMS, the QC laboratory system, on the platform; 1.17.2: QMS documents in force, controlled copies, PQR fill, risk management; Qualification cleaning limits)
