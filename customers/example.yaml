# Example customer config (template). One file per customer: customers/<name>.yaml (decision D-04).
# It is the customer's system description (PL-09) and the only way to change their system (PL-10):
# every commit needs the customer's change reference and a reason (D-08, CP-02).
# Secrets: customers/<name>.secrets.yaml.age, encrypted with age to the owner's and the server's keys (D-12).
customer: example
version: 0.6.0                    # platform release
domain: medhanta.example.com      # core at https://<domain>, product p at https://<p>.<domain>
host: deploy@medhanta.example.com # SSH target (online sites); offline sites set "offline: true" instead
host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleOnlyReplaceWithTheServerHostKey000000
security_contact: it-security@example.com
backup:                           # off-server copy (PL-11): folder on the rclone remote in the secrets (default Google Drive)
  path: medhanta-backups/example
change_ref: CC-2026-001           # the customer's change reference for this change
reason: First installation
# A new product (docs/05-add-a-product.md): add its name to licences, its links under links (views from its manifest
# "reads"), and its login password and OIDC client secret to the secrets (template: example.secrets.template.yaml).
licences: [hello]                 # licensed products; all others are off (login off, containers stopped)
links:                            # product -> provider database -> published views it reads
  # logbook: { master_data: [equipment_v1, instrument_v1, room_v1, product_v1] }   # Pharma Logbook (D-29)
  # mms: { master_data: [material_v1, supplier_v1, product_v1, room_v1] }   # Material Management
  # qms: { master_data: [product_v1, supplier_v1], deviations: [capa_v1] }   # QMS (deviations once Deviations is licensed)
  # qual: { master_data: [equipment_v1, instrument_v1, room_v1] }   # Qualification Protocols
  # deviations: { identity: [employee_v1], logbook: [equipment_v1, entry_v1, calibration_v1, logbook_sop_v1] }   # Deviations & CAPA (Batchwright link off until Batchwright moves)
  hello:
    master_data: [equipment_v1]
outside_logins: {}                # outside system -> provider database -> views, e.g. sap: {materials: [material_v1]}
