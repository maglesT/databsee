# Example customer config (template). One file per customer: customers/<name>.yaml (decision D-04).
# It is the customer's system description (PL-09) and the only way to change their system (PL-10):
# every commit needs the customer's change reference and a reason (D-08, CP-02).
# Secrets: customers/<name>.secrets.yaml.age, encrypted with age to the owner's and the server's keys (D-12).
customer: example
version: 0.6.0                    # platform release
domain: medhanta.example.com      # core at https://<domain>, product p at https://<p>.<domain>
host: deploy@medhanta.example.com # SSH target (online sites); offline sites set "offline: true" instead
host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleOnlyReplaceWithTheServerHostKey000000
security_contact: it-security@example.com
backup:                           # off-server copy (PL-11): folder on the rclone remote in the secrets (default Google Drive)
  path: medhanta-backups/example
change_ref: CC-2026-001           # the customer's change reference for this change
reason: First installation
# A new product (docs/05-add-a-product.md): add its name to licences, its links under links (views from its manifest
# "reads"), and its login password and OIDC client secret to the secrets (template: example.secrets.template.yaml).
# proxy: external                # the host already runs its own proxy on 80/443 (README "Behind the host's proxy")
# db_port: 5440                  # host port of the platform database (127.0.0.1 only) if another PostgreSQL owns 5432 (D-18)
licences: [hello]                 # licensed products; all others are off (login off, containers stopped)
links:                            # product -> provider database -> published views it reads
  # core: { recruitment: [hire_v1, training_v1] }   # core itself (D-75): "From Recruitment" hires and training beside permissions
  # logbook: { master_data: [equipment_v1, instrument_v1, room_v1, product_v1], qual: [qualification_v1, protocol_v1], deviations: [deviation_v1], truebatch: [batch_fact_v1, equipment_use_v1], truebatch_packing: [equipment_use_v1] }   # Pharma Logbook (D-29; qual, deviations, truebatch, truebatch_packing once licensed)
  # mms: { master_data: [material_v1, supplier_v1, product_v1, room_v1], truebatch: [material_use_v1], truebatch_packing: [material_use_v1] }   # Material Management (D-30; truebatch, truebatch_packing once licensed)
  # qms: { master_data: [product_v1, supplier_v1], deviations: [capa_v1] }   # QMS (deviations once Deviations is licensed)
  # qual: { master_data: [equipment_v1, instrument_v1, room_v1] }   # Qualification Protocols
  # deviations: { identity: [employee_v1], logbook: [equipment_v1, entry_v1, calibration_v1, logbook_sop_v1, overdue_v1], truebatch: [batch_fact_v1, equipment_use_v1, deviation_note_v1], truebatch_packing: [deviation_note_v1] }   # Deviations & CAPA (D-31; logbook, truebatch, truebatch_packing once licensed)
  # recruitment: { identity: [employee_v1] }   # Recruitment (staff directory for the write-time check)
  # ops: { master_data: [equipment_v1, product_v1], logbook: [equipment_v1, entry_v1] }   # Operations (logbook only when licensed)
  # truebatch: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], deviations: [deviation_v1], qms: [change_v1], logbook: [equipment_status_v1], mms: [lot_v1, lot_test_v1] }   # TrueBatch Tablets (D-27, D-28; deviations, qms, logbook, mms once licensed)
  # truebatch_packing: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], truebatch: [batch_fact_v1], mms: [lot_v1, lot_test_v1], logbook: [equipment_status_v1], deviations: [deviation_v1], qms: [change_v1] }   # TrueBatch Tablets Packing at https://truebatch-packing.<domain> (D-29; truebatch, mms, logbook, deviations, qms once licensed)
  # truebatch_injectables: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], deviations: [deviation_v1], qms: [change_v1], logbook: [equipment_status_v1], mms: [lot_v1, lot_test_v1] }   # TrueBatch Injectables at https://truebatch-injectables.<domain>
  # truebatch_api: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], deviations: [deviation_v1], qms: [change_v1], logbook: [equipment_status_v1], mms: [lot_v1, lot_test_v1], recruitment: [training_v1] }   # TrueBatch API at https://truebatch-api.<domain> (D-88)
  # truebatch_injectables_packing: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], truebatch_injectables: [batch_fact_v1], mms: [lot_v1, lot_test_v1], logbook: [equipment_status_v1], deviations: [deviation_v1], qms: [change_v1] }   # TrueBatch Injectables Packing at https://truebatch-injectables-packing.<domain>
  # truebatch_capsules: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], deviations: [deviation_v1], qms: [change_v1], logbook: [equipment_status_v1], mms: [lot_v1, lot_test_v1], recruitment: [training_v1] }   # TrueBatch Capsules at https://truebatch-capsules.<domain>
  # truebatch_capsules_packing: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], truebatch_capsules: [batch_fact_v1, deviation_note_v1], mms: [lot_v1, lot_test_v1], logbook: [equipment_status_v1], deviations: [deviation_v1], qms: [change_v1], recruitment: [training_v1] }   # TrueBatch Capsules Packing at https://truebatch-capsules-packing.<domain>
  # lims: { master_data: [equipment_v1, instrument_v1, room_v1, material_v1, product_v1], deviations: [deviation_v1], qms: [change_v1], logbook: [equipment_status_v1], mms: [lot_v1, lot_test_v1], recruitment: [training_v1], truebatch: [batch_fact_v1] }   # Medhanta LIMS at https://lims.<domain>
  hello:
    master_data: [equipment_v1]
outside_logins: {}                # outside system -> provider database -> views, e.g. sap: {materials: [material_v1]}
