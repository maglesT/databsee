# Template of customers/<name>.secrets.yaml (never committed unencrypted). Fill it, then encrypt it to the owner's and
# the server's age keys:  age -r <owner key> -r <server key> -o customers/<name>.secrets.yaml.age <file>  (D-12)
logins:                         # PostgreSQL passwords, at least 16 characters each
  postgres: REPLACE-superuser-password
  core_app: REPLACE-core-app-password
  hello_app: REPLACE-one-per-licensed-product
  # logbook_app: REPLACE-logbook-app-password
  # mms_app: REPLACE-mms-app-password
  # qms_app: REPLACE-qms-app-password
  # qual_app: REPLACE-qual-app-password
  # deviations_app: REPLACE-deviations-app-password
  # recruitment_app: REPLACE-recruitment-app-password
  # ops_app: REPLACE-ops-app-password
  # truebatch_app: REPLACE-truebatch-app-password
  # truebatch_packing_app: REPLACE-truebatch-packing-app-password
  # truebatch_injectables_app: REPLACE-truebatch-injectables-app-password
  # truebatch_api_app: REPLACE-truebatch-api-app-password
  # truebatch_injectables_packing_app: REPLACE-truebatch-injectables-packing-app-password
  # truebatch_capsules_app: REPLACE-truebatch-capsules-app-password
  # truebatch_capsules_packing_app: REPLACE-truebatch-capsules-packing-app-password
  # lims_app: REPLACE-lims-app-password
  # audit_app: REPLACE-audit-app-password
  # truebatch_liquids_app: REPLACE-truebatch-liquids-app-password
  # truebatch_liquids_packing_app: REPLACE-truebatch-liquids-packing-app-password
  # ext_<name>: one per outside system
oidc:
  # core's signing key: an RSA private key as JWK (ID tokens are signed RS256, the OIDC default every client accepts;
  # an Ed25519-only key makes core refuse every product's sign-on with invalid_client_metadata). Make one with
  # node -e "const k=require('crypto').generateKeyPairSync('rsa',{modulusLength:2048}).privateKey.export({format:'jwk'});console.log(JSON.stringify({keys:[{...k,use:'sig',alg:'RS256',kid:'core-1'}]}))"
  jwks: { keys: [ { kty: RSA, use: sig, alg: RS256, kid: core-1, n: REPLACE, e: AQAB, d: REPLACE, p: REPLACE, q: REPLACE, dp: REPLACE, dq: REPLACE, qi: REPLACE } ] }
  cookie_keys: [REPLACE-random-cookie-key-1]
  clients:
    hello: REPLACE-oidc-client-secret   # one per licensed product
    # logbook: REPLACE-oidc-client-secret
    # mms: REPLACE-oidc-client-secret
    # qms: REPLACE-oidc-client-secret
    # qual: REPLACE-oidc-client-secret
    # deviations: REPLACE-oidc-client-secret
    # recruitment: REPLACE-oidc-client-secret
    # ops: REPLACE-oidc-client-secret
    # truebatch: REPLACE-oidc-client-secret
    # truebatch_packing: REPLACE-oidc-client-secret
    # truebatch_injectables: REPLACE-oidc-client-secret
    # lims: REPLACE-oidc-client-secret
    # audit: REPLACE-oidc-client-secret
    # truebatch_api: REPLACE-oidc-client-secret
    # truebatch_injectables_packing: REPLACE-oidc-client-secret
    # truebatch_capsules: REPLACE-oidc-client-secret
    # truebatch_capsules_packing: REPLACE-oidc-client-secret
    # truebatch_liquids: REPLACE-oidc-client-secret
    # truebatch_liquids_packing: REPLACE-oidc-client-secret
env: {}                         # a product's own extra settings, e.g. logbook: { SARVAM_API_KEY: ..., GEMINI_API_KEY: ... }, deviations: { GEMINI_API_KEY: ... },
                                # never for a plant: truebatch and truebatch_packing { TRUEBATCH_DEMO: "1" } only on the demo installation (D-30); lims { LIMS_DEMO: "1" } likewise (D-91)
smtp_url: smtp://user:password@mail.example.com:587   # lockout emails (D-03); optional
backup_key: REPLACE-with-openssl-rand-base64-32   # MED-02: key of the rclone crypt remote; also as a sealed offline copy (README "Backups")
backup:                         # the rclone remote for off-server backups (D-14), in a Google account used only for them
  type: drive
  scope: drive.file
  token: '{"access_token":"REPLACE","token_type":"Bearer","refresh_token":"REPLACE","expiry":"2026-01-01T00:00:00Z"}'
