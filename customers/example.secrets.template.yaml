# Template of customers/<name>.secrets.yaml (never committed unencrypted). Fill it, then encrypt it to the owner's and
# the server's age keys:  age -r <owner key> -r <server key> -o customers/<name>.secrets.yaml.age <file>  (D-12)
logins:                         # PostgreSQL passwords, at least 16 characters each
  postgres: REPLACE-superuser-password
  core_app: REPLACE-core-app-password
  hello_app: REPLACE-one-per-licensed-product
  # logbook_app: REPLACE-logbook-app-password
  # mms_app: REPLACE-mms-app-password
  # qms_app: REPLACE-qms-app-password
  # qual_app: REPLACE-qual-app-password
  # deviations_app: REPLACE-deviations-app-password
  # ext_<name>: one per outside system
oidc:
  jwks: { keys: [ { kty: OKP, crv: Ed25519, d: REPLACE, x: REPLACE } ] }   # core's signing key
  cookie_keys: [REPLACE-random-cookie-key-1]
  clients:
    hello: REPLACE-oidc-client-secret   # one per licensed product
    # logbook: REPLACE-oidc-client-secret
    # mms: REPLACE-oidc-client-secret
    # qms: REPLACE-oidc-client-secret
    # qual: REPLACE-oidc-client-secret
    # deviations: REPLACE-oidc-client-secret
env: {}                         # a product's own extra settings, e.g. logbook: { SARVAM_API_KEY: ..., GEMINI_API_KEY: ... }, deviations: { GEMINI_API_KEY: ... }
smtp_url: smtp://user:password@mail.example.com:587   # lockout emails (D-03); optional
backup:                         # the rclone remote for off-server backups (D-14)
  type: drive
  scope: drive.file
  token: '{"access_token":"REPLACE","token_type":"Bearer","refresh_token":"REPLACE","expiry":"2026-01-01T00:00:00Z"}'
