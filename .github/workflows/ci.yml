name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - name: Every cited clause exists and contains its quote
        run: python3 scripts/check-register.py --render docs/03-compliance-register.md
      - name: Rendered register is up to date
        run: git diff --exit-code docs/03-compliance-register.md
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: PostgreSQL 17 binaries for the PL-11 restore test, rclone
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 rclone
      - name: Off-server store for the PL-11 test (MinIO with Object Lock; the server key gets deploy/backup-policy.json)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ci-root -e MINIO_ROOT_PASSWORD=ci-root-password \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          sed 's/BUCKET/backups/g' deploy/backup-policy.json > "$RUNNER_TEMP/policy.json"
          for i in $(seq 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host -v "$RUNNER_TEMP/policy.json:/policy.json" --entrypoint sh \
            quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z -c 'mc alias set ci http://127.0.0.1:9000 ci-root ci-root-password &&
              mc mb --with-lock ci/backups && mc retention set --default COMPLIANCE 1d ci/backups && mc admin policy create ci backup-writer /policy.json &&
              mc admin user add ci server-key server-secret-key-123 && mc admin policy attach ci backup-writer --user server-key'
      - name: Tests (named by rule ID)
        run: npm test
        env:
          BACKUP_TEST_REMOTE: offsite:backups/ci
          RCLONE_CONFIG_OFFSITE_TYPE: s3
          RCLONE_CONFIG_OFFSITE_PROVIDER: Minio
          RCLONE_CONFIG_OFFSITE_ENDPOINT: http://127.0.0.1:9000
          RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: server-key
          RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: server-secret-key-123
          RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: 'true'
