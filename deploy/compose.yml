# One customer server. deploy/apply.ts writes the settings in $MEDHANTA_STATE (on a server /var/lib/medhanta/state;
# never committed) from the customer
# config and its secrets, then starts db, core, caddy and the licensed products (each product has a profile
# named after it, so it runs only when licensed). VERSION is the platform release from the config.
name: medhanta                     # same project for every release folder
x-platform: &platform
  image: medhanta/platform:${VERSION:-0.0.0}
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
    interval: 10s
services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    # PL-11: every WAL file is archived to /archive/wal (at least every 5 minutes); deploy/backup.sh adds the
    # nightly base backup and copies the archive off the server.
    # TLS for database connections (Batchwright refuses an unencrypted session, its DI-13): a self-signed certificate for
    # the name "db", made once; its certificate (not the key) is shared read-only with the products that verify it.
    entrypoint: ["bash", "-c", "mkdir -p /archive/wal /archive/base && chown postgres /archive/wal /archive/base &&
      if [ ! -f /tls/server.key ] || [ ! -f /tls/server.crt ]; then openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1
        -nodes -days 3650 -subj /CN=db -addext subjectAltName=DNS:db -keyout /tls/server.key.new -out /tls/server.crt.new &&
        mv /tls/server.key.new /tls/server.key && mv /tls/server.crt.new /tls/server.crt; fi &&
      chown postgres /tls/server.key && chmod 600 /tls/server.key && cp /tls/server.crt /tls-ca/server.crt && chmod 644 /tls-ca/server.crt &&
      exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=300",
              "-c", "archive_command=test ! -f /archive/wal/%f && cp %p /archive/wal/%f.tmp && mv /archive/wal/%f.tmp /archive/wal/%f",
              "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key", "-c", "ssl_min_protocol_version=TLSv1.2"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
    secrets: [pg_superuser]
    ports: ["127.0.0.1:5432:5432"]   # for apply.ts on the host only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /var/lib/medhanta/archive:/archive
      - pgtls:/tls
      - pgca:/tls-ca
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
  core:
    <<: *platform
    command: ["npx", "tsx", "apps/core/server/index.ts"]
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/core.env
    environment: { PORT: "3000" }
  hello:                             # reference product: CI and demos only, never licensed at a customer
    <<: *platform
    profiles: [hello]
    command: ["npx", "tsx", "apps/hello/index.ts"]
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/hello.env
    environment: { PORT: "3000" }
  logbook:                           # Pharma Logbook, built from its own repo at the commit in apps/logbook/manifest.json (D-29)
    image: medhanta/logbook:${LOGBOOK_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [logbook]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as logbook_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/logbook.env
    environment: { PORT: "3000" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  mms:                               # Material Management, built from its own repo at the commit in apps/mms/manifest.json (D-55 in that repo)
    image: medhanta/mms:${MMS_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [mms]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as mms_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/mms.env
    environment: { PORT: "3000" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  qms:                               # QMS, built from its own repo at the commit in apps/qms/manifest.json (D-11 in that repo)
    image: medhanta/qms:${QMS_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [qms]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as qms_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/qms.env
    environment: { PORT: "3000" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  qual:                              # Qualification Protocols, built from its own repo at the commit in apps/qual/manifest.json (D-21 in that repo)
    image: medhanta/qual:${QUAL_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [qual]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as qual_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/qual.env
    environment: { PORT: "3000" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  deviations:                        # Deviations & CAPA, built from its own repo at the commit in apps/deviations/manifest.json (D-42 in that repo)
    image: medhanta/deviations:${DEVIATIONS_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [deviations]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as deviations_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/deviations.env
    environment: { PORT: "3000" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  recruitment:                       # Recruitment, built from its own repo at the commit in apps/recruitment/manifest.json (D-74 in that repo)
    image: medhanta/recruitment:${RECRUITMENT_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [recruitment]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as recruitment_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/recruitment.env
    environment: { PORT: "3000" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  ops:                               # Operations / OEE, built from its own repo at the commit in apps/ops/manifest.json (D-19 in that repo)
    image: medhanta/ops:${OPS_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      ops-ml: { condition: service_started }
    profiles: [ops]
    command: ["node", "dist/server/index.js"]   # apply.ts runs its migrations as ops_owner
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/ops.env
    environment: { PORT: "3000", ML_URL: "http://ops-ml:8000" }
    networks: [default, ops-ml]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
  ops-ml:                            # Operations' ML worker (its D-08): internal network only, no database, no internet
    image: medhanta/ops-ml:${OPS_COMMIT:-none}
    restart: unless-stopped
    profiles: [ops]
    networks: [ops-ml]
  ebmr:                              # Batchwright (Tablets eBMR), built from its own repo at the commit in apps/ebmr/manifest.json
    image: medhanta/ebmr:${EBMR_COMMIT:-none}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    profiles: [ebmr]
    # Default command: the server. apply.ts first runs "migrate" (manifest "migrate": "own") as the superuser.
    env_file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/ebmr.env
    environment:
      PORT: "3000"
      EBMR_INSTALLATION: GMP
      EBMR_ENV: production
      # Batchwright refuses a database session without verified TLS (its DI-13): it checks the db's certificate.
      EBMR_DB_CA_FILE: /tls-ca/server.crt
      EBMR_KEYS_DIR: /var/lib/ebmr/keys
      EBMR_SECRETS_FILE: /var/lib/ebmr/keys/secrets.json
      EBMR_SEAL_KEY_FILE: /var/lib/ebmr/keys/seal-key.json
      EBMR_SERVICE_KEYS_FILE: /var/lib/ebmr/keys/service-keys.json
      EBMR_NUMBER_LEDGER_FILE: /var/lib/ebmr/numbers.ledger.jsonl
      EBMR_EXCHANGE_DIR: /var/lib/ebmr/exchange
    volumes:
      - pgca:/tls-ca:ro
      - ebmr:/var/lib/ebmr
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ${MEDHANTA_STATE:-/var/lib/medhanta/state}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
secrets:
  pg_superuser:
    file: ${MEDHANTA_STATE:-/var/lib/medhanta/state}/pg_superuser
networks:
  ops-ml: { internal: true }
volumes:
  pgdata:
  pgtls:
  pgca:
  ebmr:
  caddy:
